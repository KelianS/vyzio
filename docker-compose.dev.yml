# Development override — builds images locally instead of pulling from GHCR.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  vyzio-dashboard:
    profiles:
      - donotstart
    # <= comment the build section to use pnpm dev server instead of the built dashboard image =>
    # build:
    #   context: .
    #   dockerfile: src/dashboard/Dockerfile

  vyzio-api:
    build:
      context: .
      dockerfile: src/vyzio/Vyzio.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
