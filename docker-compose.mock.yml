services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: vyzio-mediamtx
    networks:
      - vyzio-net
    ports:
      - "127.0.0.1:8554:8554"

  mock-camera:
    image: jrottenberg/ffmpeg:7.1-alpine
    container_name: vyzio-mock-camera
    depends_on:
      - mediamtx
    command:
      - -hide_banner
      - -loglevel
      - warning
      - -re
      - -f
      - lavfi
      - -i
      - testsrc=size=1280x720:rate=5
      - -f
      - lavfi
      - -i
      - sine=frequency=1000:sample_rate=44100
      - -c:v
      - libx264
      - -preset
      - ultrafast
      - -tune
      - zerolatency
      - -pix_fmt
      - yuv420p
      - -c:a
      - aac
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://mediamtx:8554/test-camera
    networks:
      - vyzio-net

  frigate:
    depends_on:
      - mqtt
      - mediamtx
      - mock-camera
    volumes:
      - ./config/frigate.mock.yml:/config/config.yml:ro

networks:
  vyzio-net:
    driver: bridge