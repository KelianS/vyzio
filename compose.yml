# Production stack: pre-built images from GHCR, its settings in .env (cp .env.example .env).
#
# Every other Vyzio setting has a production-ready default, overridable with a VYZIO_* variable
# under vyzio-api's environment (CONTRIBUTING.md).
#
# For local development with live builds, apply the dev override:
#   docker compose -f compose.yml -f compose.dev.yml up -d

# Fixed, so a clone or worktree in another folder drives the same stack and its fixed container names.
name: vyzio

services:
  vyzio-dashboard:
    image: ghcr.io/kelians/vyzio-dashboard:${VYZIO_VERSION:?set the Vyzio release in .env}
    container_name: vyzio-dashboard
    restart: unless-stopped
    depends_on:
      vyzio-api:
        condition: service_healthy
    environment:
      - VITE_API_PROXY_TARGET=http://vyzio-api:8443
    ports:
      - "${VYZIO_PORT:-8080}:8080"
    networks:
      - vyzio-net

  vyzio-api:
    image: ghcr.io/kelians/vyzio-api:${VYZIO_VERSION:?set the Vyzio release in .env}
    container_name: vyzio-api
    restart: unless-stopped
    depends_on:
      frigate:
        condition: service_healthy
    # Reads the accelerator device nodes to pick a detector, and falls back to CPU on a host that
    # has none (ADR-08). The docker socket below is what restarts Frigate once the config is written.
    privileged: true
    environment:
      ASPNETCORE_HTTP_PORTS: 8443
      VYZIO_TIME_ZONE: ${VYZIO_TIME_ZONE:-}
      VYZIO_DISCOVERY_PROBE_CIDRS: ${VYZIO_DISCOVERY_PROBE_CIDRS:-}
    volumes:
      - ${VYZIO_DATA_DIR:-./data}/config:/config # shared with frigate: API writes config.yml, Frigate reads it
      - ${VYZIO_DATA_DIR:-./data}/data:/app/data # contains DB
      - /var/run/docker.sock:/var/run/docker.sock:ro # used to reload Frigate after config changes
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /dev:/dev:ro
    networks:
      - vyzio-net

  mqtt:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: vyzio-mqtt
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf 'listener 1883\nallow_anonymous true\nlog_dest stdout\n' > /tmp/mosquitto.conf
        mosquitto -c /tmp/mosquitto.conf
    # The image's VOLUMEs are unused; tmpfs keeps Docker from creating anonymous volumes for them.
    tmpfs:
      - /mosquitto/data
      - /mosquitto/log
    networks:
      - vyzio-net
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "healthcheck", "-m", "ping", "-q", "0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.17.2
    container_name: vyzio-frigate
    restart: unless-stopped
    depends_on:
      mqtt:
        condition: service_healthy
    # Drives the detector that was picked, which needs the real device and not just its node (ADR-08).
    privileged: true
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ${VYZIO_DATA_DIR:-./data}/config:/config # shared with vyzio-api: reads config.yml generated by Vyzio
      - ${VYZIO_DATA_DIR:-./data}/frigate:/media/frigate
      - /etc/localtime:/etc/localtime:ro
      - /dev:/dev
    # /dev:/dev hides the container's own /dev/shm, so it is mounted again at the size Frigate needs.
    tmpfs:
      - /dev/shm:size=512m
      # Recording segments wait here before Frigate moves them; its docs keep them in RAM.
      - /tmp/cache:size=1g
    networks:
      - vyzio-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  vyzio-net:
    driver: bridge
