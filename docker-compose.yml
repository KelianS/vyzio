# Production stack — uses pre-built images from GHCR.
# Pin a release with: VYZIO_VERSION=1.0.0 docker compose up -d
#
# For local development with live builds, apply the dev override:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  vyzio-dashboard:
    image: ghcr.io/kelians/vyzio-dashboard:${VYZIO_VERSION:-latest}
    container_name: vyzio-dashboard
    restart: unless-stopped
    depends_on:
      - vyzio-api
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - vyzio-net

  vyzio-api:
    image: ghcr.io/kelians/vyzio-api:${VYZIO_VERSION:-latest}
    container_name: vyzio-api
    restart: unless-stopped
    depends_on:
      - frigate
    environment:
      ASPNETCORE_URLS: http://+:8443
      VYZIO_CONFIG_PATH: /app/config/vyzio.yml
    volumes:
      - ./config:/app/config
      - vyzio-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    # The vyzio user (non-root) must write to ./config (frigate.generated.yml).
    # If the host docker socket GID is not 999: add group_add: ["<GID>"]
    # Inspect GID with: stat -c '%g' /var/run/docker.sock
    networks:
      - vyzio-net
    ports:
      - "127.0.0.1:8443:8443"

  mqtt:
    image: eclipse-mosquitto:2
    container_name: vyzio-mqtt
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf 'listener 1883\nallow_anonymous true\nlog_dest stdout\n' > /tmp/mosquitto.conf
        mosquitto -c /tmp/mosquitto.conf
    networks:
      - vyzio-net

  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    container_name: vyzio-frigate
    restart: unless-stopped
    depends_on:
      - mqtt
    privileged: true
    shm_size: "512mb"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./config/frigate.generated.yml:/config/config.yml:ro
      - frigate-data:/media/frigate
      - /etc/localtime:/etc/localtime:ro
    networks:
      - vyzio-net

networks:
  vyzio-net:
    driver: bridge

volumes:
  frigate-data:
  vyzio-data:
