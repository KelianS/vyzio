# Production stack — uses pre-built images from GHCR.
# Pin a release with: VYZIO_VERSION=1.0.0 docker compose up -d
#
# All Vyzio settings have sensible defaults. Override with VYZIO_* environment variables, e.g.:
#   VYZIO_TIME_ZONE: Europe/Paris
#   VYZIO_DISCOVERY_PROBE_CIDRS: 192.168.1.0/24,192.168.2.0/24
#
# For local development with live builds, apply the dev override:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  vyzio-dashboard:
    image: ghcr.io/kelians/vyzio-dashboard:${VYZIO_VERSION:-latest}
    container_name: vyzio-dashboard
    restart: unless-stopped
    depends_on:
      vyzio-api:
        condition: service_healthy
    environment:
      - VITE_API_PROXY_TARGET=http://vyzio-api:8443
    ports:
      - "8080:8080"
    networks:
      - vyzio-net

  vyzio-api:
    image: ghcr.io/kelians/vyzio-api:${VYZIO_VERSION:-latest}
    container_name: vyzio-api
    restart: unless-stopped
    depends_on:
      frigate:
        condition: service_healthy
    # privileged + /dev bind mount: detection materielle (ADR-34), sans casser le demarrage
    # sur un host sans iGPU/Coral.
    privileged: true
    environment:
      ASPNETCORE_HTTP_PORTS: 8443
      VYZIO_TIME_ZONE: Europe/Paris
      VYZIO_DISCOVERY_PROBE_CIDRS: 192.168.0.0/24,192.168.1.0/24
    volumes:
      - vyzio-config:/config           # shared with frigate: API writes config.yml, Frigate reads it
      - vyzio-data:/app/data           # contains DB
      - /var/run/docker.sock:/var/run/docker.sock:ro # used to reload Frigate after config changes
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /dev:/dev:ro
    networks:
      - vyzio-net

  mqtt:
    image: eclipse-mosquitto:2
    container_name: vyzio-mqtt
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf 'listener 1883\nallow_anonymous true\nlog_dest stdout\n' > /tmp/mosquitto.conf
        mosquitto -c /tmp/mosquitto.conf
    networks:
      - vyzio-net
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "healthcheck", "-m", "ping", "-q", "0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.17.1
    container_name: vyzio-frigate
    restart: unless-stopped
    depends_on:
      mqtt:
        condition: service_healthy
    # privileged + /dev bind mount: exploitation reelle du detecteur choisi (ADR-34).
    privileged: true
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - vyzio-config:/config           # shared with vyzio-api: reads config.yml generated by Vyzio
      - frigate-data:/media/frigate
      - /etc/localtime:/etc/localtime:ro
      - /dev:/dev
    # /dev:/dev overwrites the container's own /dev/shm with the host's — re-mount it explicitly as
    # tmpfs so Frigate keeps a dedicated, correctly-sized shared memory (replaces shm_size:).
    tmpfs:
      - /dev/shm:size=512m
    networks:
      - vyzio-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  vyzio-net:
    driver: bridge

volumes:
  vyzio-config:
  vyzio-data:
  frigate-data:
