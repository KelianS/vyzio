services:
  vyzio-api:
    # Minimal Vyzio API runtime for local development.
    build:
      context: .
      dockerfile: src/vyzio/Vyzio.Api/Dockerfile
    container_name: vyzio-api
    restart: unless-stopped
    depends_on:
      - frigate
    environment:
      ASPNETCORE_URLS: http://+:8443
      VYZIO_CONFIG_PATH: /app/config/vyzio.yml
    volumes:
      - ./config:/app/config
      - vyzio-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/timezone:/etc/timezone:ro
    networks:
      - vyzio-net
    ports:
      - "127.0.0.1:8443:8443"

  mqtt:
    # Dedicated MQTT broker used by Frigate and later by Vyzio integration.
    image: eclipse-mosquitto:2
    container_name: vyzio-mqtt
    restart: unless-stopped
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - vyzio-net

  frigate:
    # Frigate stays embedded as the video runtime and is configured by a
    # development-only fallback file until Vyzio manages the effective config.
    image: ghcr.io/blakeblackshear/frigate:stable
    container_name: vyzio-frigate
    restart: unless-stopped
    depends_on:
      - mqtt
    privileged: true
    shm_size: "512mb"
    # Expose frigate for advanced mode.
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      # Vyzio owns the effective Frigate config for the nominal product flow.
      - ./config/frigate.generated.yml:/config/config.yml:ro
      - frigate-data:/media/frigate
      - /etc/localtime:/etc/localtime:ro
    networks:
      - vyzio-net

networks:
  vyzio-net:
    driver: bridge

volumes:
  frigate-data:
  vyzio-data:
