services:
  vyzio-api:
    # Minimal Vyzio API runtime for local development.
    build:
      context: .
      dockerfile: src/vyzio/Vyzio.Api/Dockerfile
    container_name: vyzio-api
    depends_on:
      - frigate
    environment:
      ASPNETCORE_URLS: http://+:8443
      VYZIO_CONFIG_PATH: /app/config/vyzio.yml
    volumes:
      - ./config:/app/config:ro
      - vyzio-data:/app/data
    networks:
      - vyzio-net
    ports:
      - "127.0.0.1:8443:8443"

  frigate:
    # Frigate stays embedded as the video runtime and is configured by a
    # development-only fallback file until Vyzio manages the effective config.
    image: ghcr.io/blakeblackshear/frigate:stable
    container_name: vyzio-frigate
    privileged: true
    shm_size: "512mb"
    volumes:
      # Development runtime only: this sample config is replaced later by
      # a Vyzio-managed Frigate config in the nominal product flow.
      - ./config/frigate.dev.yml:/config/config.yml:ro
      - frigate-data:/media/frigate
      - /etc/localtime:/etc/localtime:ro
    networks:
      - vyzio-net

networks:
  vyzio-net:
    driver: bridge

volumes:
  frigate-data:
  vyzio-data:
