name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & push Docker images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/vyzio/Vyzio.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/kelians/vyzio-api:${{ steps.version.outputs.version }}
            ghcr.io/kelians/vyzio-api:latest
          build-args: |
            VYZIO_VERSION=${{ steps.version.outputs.version }}
            VYZIO_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/dashboard/Dockerfile
          push: true
          tags: |
            ghcr.io/kelians/vyzio-dashboard:${{ steps.version.outputs.version }}
            ghcr.io/kelians/vyzio-dashboard:latest
          build-args: |
            VYZIO_VERSION=${{ steps.version.outputs.version }}
            VYZIO_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Last, so a release never exists without the images it announces. Skipped when the release is
      # already there, which is the case when it was drafted from the interface rather than tagged.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, leaving it untouched."
            exit 0
          fi
          notes="$RUNNER_TEMP/notes.md"
          : > "$notes"
          # The annotation is the part only a person can write, so it leads. Read from the API
          # because checkout refetches the commit over refs/tags/<tag>, flattening the annotated
          # object it had just fetched, after which git reads back the commit message instead.
          # A lightweight tag has no annotation and the generated list below stands on its own.
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
          if [ "${ref%% *}" = "tag" ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/tags/${ref##* }" --jq .message > "$notes"
          fi
          {
            echo
            echo '### Images'
            echo
            echo '```'
            echo "ghcr.io/kelians/vyzio-api:$VERSION"
            echo "ghcr.io/kelians/vyzio-dashboard:$VERSION"
            echo '```'
            echo
          } >> "$notes"
          # Asking the API outright rather than through --generate-notes, whose documented
          # interaction is with --notes and not with a notes file.
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes"             -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" --jq .body >> "$notes"
          gh release create "$TAG" --title "$TAG" --notes-file "$notes" --verify-tag
