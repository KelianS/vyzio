name: Security

# Called by CI, so its jobs run on every pull request, on main and on the daily schedule, under ci-ok.
on:
  workflow_call:

# Read-only by default; a job that writes says so in its own permissions.
permissions:
  contents: read

jobs:
  codeql-backend:
    name: CodeQL — C#
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No build: CodeQL reads the sources directly, so the job needs no .NET SDK.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: csharp
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

  codeql-frontend:
    name: CodeQL — TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

  semgrep:
    name: Semgrep — SAST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Semgrep
        run: pip3 install semgrep==1.177.0 --break-system-packages

      # On a pull request only a finding its base lacks fails; a false positive gets a nosemgrep comment where it stands.
      - name: Verdict
        env:
          BASELINE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
        run: semgrep scan --config auto --error ${BASELINE:+--baseline-commit "$(git rev-parse "$BASELINE")"} src/

      # After the verdict, whose baseline mode refuses a working tree with files the checkout did not bring.
      - name: Full scan for code scanning
        if: ${{ !cancelled() }}
        run: semgrep scan --config auto --sarif --output semgrep.sarif src/

      # A fork's pull request gets a read-only token, so the upload is skipped; the job verdict stands.
      - name: Upload to code scanning
        if: always() && !github.event.pull_request.head.repo.fork && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A new advisory reaches every pull request at once: it warns there and fails main and its daily run.
    env:
      BLOCKING: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-backend

      - name: Restore .NET packages
        run: dotnet restore src/vyzio/Vyzio.slnx

      # dotnet list exits 0 whatever it finds, so the verdict is read from its JSON report.
      - name: Check .NET vulnerable packages
        run: |
          set -euo pipefail
          verdict() {
            if [ "$BLOCKING" = true ]; then echo "::error::$1"; exit 1; fi
            echo "::warning::$1 (informational on a pull request)"
          }
          dotnet list src/vyzio/Vyzio.slnx package --vulnerable --include-transitive --format json > vulnerable.json
          jq -r '.projects[] | .path as $p | .frameworks[]? | (.topLevelPackages // []) + (.transitivePackages // []) | .[]
                 | "\($p): \(.id) \(.resolvedVersion) \([.vulnerabilities[]?.severity] | join(","))"' vulnerable.json | tee findings.txt
          if [ -s findings.txt ]; then verdict "Vulnerable .NET packages found"; fi
          # An unreachable vulnerability source lists nothing and records a problem: that is not a pass.
          if jq -e '[.problems[]?] | length > 0' vulnerable.json > /dev/null; then
            jq -r '.problems[] | .text' vulnerable.json
            verdict "The vulnerability audit could not complete"
          fi

      - uses: ./.github/actions/setup-dashboard
        with:
          install: 'false'

      - name: Frontend dependency audit
        run: |
          if ! pnpm --prefix src/dashboard audit --audit-level high; then
            if [ "$BLOCKING" = true ]; then echo "::error::Vulnerable frontend packages found"; exit 1; fi
            echo "::warning::Vulnerable frontend packages found (informational on a pull request)"
          fi
