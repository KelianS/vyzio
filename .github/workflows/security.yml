name: Security

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  codeql-backend:
    name: CodeQL — C#
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Build
        run: dotnet build src/vyzio/Vyzio.slnx -c Release

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  codeql-frontend:
    name: CodeQL — TypeScript
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  semgrep:
    name: Semgrep — SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Semgrep
        run: pip3 install semgrep==1.177.0 --break-system-packages

      # A false positive is silenced where it stands with a nosemgrep comment, never by letting the step pass.
      - name: Scan
        run: semgrep scan --config auto --error src/

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore .NET packages
        run: dotnet restore src/vyzio/Vyzio.slnx

      # dotnet list exits 0 whatever it finds, so the verdict is read from its JSON report.
      - name: Check .NET vulnerable packages
        run: |
          set -euo pipefail
          dotnet list src/vyzio/Vyzio.slnx package --vulnerable --include-transitive --format json > vulnerable.json
          jq -r '.projects[] | .path as $p | .frameworks[]? | (.topLevelPackages // []) + (.transitivePackages // []) | .[]
                 | "\($p): \(.id) \(.resolvedVersion) \([.vulnerabilities[]?.severity] | join(","))"' vulnerable.json | tee findings.txt
          if [ -s findings.txt ]; then echo "::error::Vulnerable .NET packages found"; exit 1; fi
          # An unreachable vulnerability source lists nothing and records a problem: that is not a pass.
          if jq -e '[.problems[]?] | length > 0' vulnerable.json > /dev/null; then
            jq -r '.problems[] | .text' vulnerable.json
            echo "::error::The vulnerability audit could not complete"; exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: src/dashboard/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Frontend dependency audit
        run: pnpm --prefix src/dashboard audit --audit-level high
