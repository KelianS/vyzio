name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request cancels the run it supersedes; on main every commit keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rules:
    name: Rules — index and citations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: go-task/setup-task@v2

      - name: Check
        run: task rules:check

  backend:
    name: Backend — build & test
    # Floor to respect if this ever moves to a container: SQLitePCLRaw 3.x needs GLIBC >= 2.33.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: go-task/setup-task@v2

      - name: Format and code style check
        run: task back:format:check

      - name: Test
        run: >
          task back:test --
          -c Release --collect:"XPlat Code Coverage" --results-directory ${{ github.workspace }}/coverage

      - name: Upload backend coverage
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: coverage/**/coverage.cobertura.xml

  frontend:
    name: Frontend — build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: src/dashboard/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: src/dashboard/pnpm-lock.yaml

      - uses: go-task/setup-task@v2

      - name: Install
        run: pnpm --prefix src/dashboard install --frozen-lockfile

      - name: Type-check
        run: task front:typecheck

      - name: Lint
        run: task front:lint

      - name: Format check
        run: task front:format:check

      # Fails on any file, export or dependency nothing reaches. The repo was cleaned to zero
      # before this step landed, so a finding here is always something the branch introduced.
      - name: Dead code
        run: task front:knip

      - name: Test
        run: task front:test -- --coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: src/dashboard/coverage/

  playwright-version:
    name: Playwright version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # The container tag must match the installed package, so only an exact pin is accepted.
      - name: Read the pinned version
        id: read
        run: |
          set -euo pipefail
          version=$(jq -r '.devDependencies["@playwright/test"] // .dependencies["@playwright/test"] // ""' src/dashboard/package.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::@playwright/test must be pinned to an exact version, found '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  e2e:
    name: Frontend e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [playwright-version]
    # Browsers and their system libraries come with the image, so no apt step depends on the runner mirrors.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: src/dashboard/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: src/dashboard/pnpm-lock.yaml

      - uses: go-task/setup-task@v2

      - name: Install
        run: pnpm --prefix src/dashboard install --frozen-lockfile

      # The Playwright webServer builds the production bundle first, so no separate build step.
      - name: E2E tests
        run: task front:test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: src/dashboard/playwright-report/

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend, frontend]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: backend-coverage
          path: backend-coverage

      - uses: actions/download-artifact@v8
        with:
          name: frontend-coverage
          path: frontend-coverage

      # Four numbers out of two files: a third-party action for that would be a dependency to
      # trust and to pin, on a job that writes to the pull request.
      - name: Read both reports
        run: |
          set -euo pipefail
          cp "$(find backend-coverage -name 'coverage.cobertura.xml' -print -quit)" backend.xml
          cp frontend-coverage/cobertura-coverage.xml frontend.xml
          # -m1 rather than `| head -1`: head closes the pipe on the first match, and the
          # grep still writing behind it dies of SIGPIPE, which pipefail turns into a failure.
          rate() {
            grep -m1 -o "$2=\"[0-9.]*\"" "$1" | tr -dc '0-9.' |
              awk '{ printf "%.1f", $1 * 100 }'
          }
          {
            echo '### Coverage'
            echo
            echo '| | Lines | Branches |'
            echo '|---|---:|---:|'
            echo "| Backend | $(rate backend.xml line-rate)% | $(rate backend.xml branch-rate)% |"
            echo "| Frontend | $(rate frontend.xml line-rate)% | $(rate frontend.xml branch-rate)% |"
            echo
            echo 'EF Core migrations and type-only files are out of the denominator. Everything that'
            echo 'emits runtime code is in it, tested or not.'
          } > coverage.md
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"

      # A fork's pull request gets a read-only token, so the comment is impossible rather than
      # merely denied: skipped, so an outside contribution never opens on a red job it cannot fix.
      # The rates are in the job summary either way.
      - name: Comment on the pull request
        if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: coverage
          recreate: true
          path: coverage.md

      # The badge endpoints live on an orphan branch, force-pushed: the README needs the latest
      # number, never the history, and main stays free of commits nobody wrote.
      - name: Publish the badge endpoints
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          badge() {
            rate=$(grep -m1 -o 'line-rate="[0-9.]*"' "$1" | tr -dc '0-9.')
            pct=$(awk -v r="$rate" 'BEGIN { printf "%.0f", r * 100 }')
            if   [ "$pct" -ge 75 ]; then colour=green
            elif [ "$pct" -ge 50 ]; then colour=yellow
            else                         colour=red
            fi
            printf '{"schemaVersion":1,"label":"%s coverage","message":"%s%%","color":"%s"}' \
              "$2" "$pct" "$colour" > "$work/badge-coverage-$2.json"
          }
          badge backend.xml backend
          badge frontend.xml frontend
          git -C "$work" init -q
          git -C "$work" checkout -qb badges
          git -C "$work" add -A
          git -C "$work" -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -qm "chore(ci): coverage badges for ${GITHUB_SHA}"
          git -C "$work" push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" badges

  docker-build-check:
    name: Docker — build images (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/vyzio/Vyzio.Api/Dockerfile
          push: false
          tags: vyzio-api:ci
          build-args: VYZIO_REVISION=${{ github.sha }}
          load: true

      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/v0.74.0/contrib/install.sh | sh -s -- -b /usr/local/bin v0.74.0

      - name: Scan API image
        run: trivy image --exit-code 1 --severity HIGH,CRITICAL --no-progress vyzio-api:ci

      - name: Build dashboard image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/dashboard/Dockerfile
          push: false
          tags: vyzio-dashboard:ci
          build-args: VYZIO_REVISION=${{ github.sha }}
          load: true

      - name: Scan dashboard image
        run: trivy image --exit-code 1 --severity HIGH,CRITICAL --no-progress vyzio-dashboard:ci
