name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend — build & test
    # SQLitePCLRaw 3.x requires GLIBC >= 2.33; ubuntu-24.04 ships 2.36
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - uses: go-task/setup-task@v2

      - name: Test
        run: >
          task back:test --
          -c Release --collect:"XPlat Code Coverage" --results-directory ${{ github.workspace }}/coverage

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage/**/coverage.cobertura.xml

  frontend:
    name: Frontend — build & test
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: src/dashboard/pnpm-lock.yaml

      - uses: go-task/setup-task@v2

      - name: Install
        run: pnpm --prefix src/dashboard install --frozen-lockfile

      - name: Type-check
        run: pnpm --prefix src/dashboard exec tsc --noEmit

      - name: Lint
        run: task front:lint

      - name: Format check
        run: task front:format:check

      - name: Test
        run: task front:test -- --coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: src/dashboard/coverage/

      - name: Build
        run: task front:build

      - name: Install Playwright browsers
        run: pnpm --prefix src/dashboard exec playwright install --with-deps chromium

      - name: E2E tests
        run: task front:test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/dashboard/playwright-report/

  coverage:
    name: Coverage
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    needs: [backend, frontend]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend-coverage

      - uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend-coverage

      # Both sides emit cobertura, so one action reads them both.
      - name: Summarise
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: 'backend-coverage/**/coverage.cobertura.xml,frontend-coverage/cobertura-coverage.xml'
          format: markdown
          output: both
          badge: true
          hide_complexity: true

      - name: Comment on the pull request
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          recreate: true
          path: code-coverage-results.md

      # The badge endpoints live on an orphan branch, force-pushed: the README needs the latest
      # number, never the history, and main stays free of commits nobody wrote.
      - name: Publish the badge endpoints
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          badge() {
            rate=$(grep -o 'line-rate="[0-9.]*"' "$1" | head -1 | grep -o '[0-9.]*')
            pct=$(awk -v r="$rate" 'BEGIN { printf "%.0f", r * 100 }')
            if   [ "$pct" -ge 75 ]; then colour=green
            elif [ "$pct" -ge 50 ]; then colour=yellow
            else                         colour=red
            fi
            printf '{"schemaVersion":1,"label":"%s coverage","message":"%s%%","color":"%s"}' \
              "$2" "$pct" "$colour" > "$work/badge-coverage-$2.json"
          }
          badge "$(find backend-coverage -name 'coverage.cobertura.xml' | head -1)" backend
          badge frontend-coverage/cobertura-coverage.xml frontend
          git -C "$work" init -q
          git -C "$work" checkout -qb badges
          git -C "$work" add -A
          git -C "$work" -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -qm "chore(ci): coverage badges for ${GITHUB_SHA}"
          git -C "$work" push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" badges

  docker-build-check:
    name: Docker — build images (no push)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/vyzio/Vyzio.Api/Dockerfile
          push: false
          tags: vyzio-api:ci
          load: true

      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan API image
        run: trivy image --exit-code 1 --severity HIGH,CRITICAL --no-progress vyzio-api:ci

      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/dashboard/Dockerfile
          push: false
          tags: vyzio-dashboard:ci
          load: true

      - name: Scan dashboard image
        run: trivy image --exit-code 1 --severity HIGH,CRITICAL --no-progress vyzio-dashboard:ci
