name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Daily on main, so an advisory published without any code change turns the run red.
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

# A new push to a pull request cancels the run it supersedes; on main every commit keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default; a job that writes says so in its own permissions.
permissions:
  contents: read

jobs:
  # A pull request that changes only documentation runs no build, test or scan job; Rules and ci-ok always run.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - name: List the changed files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "$PR" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          code=false
          while IFS= read -r file; do
            case "$file" in
              docs/*|.github/ISSUE_TEMPLATE/*|.github/pull_request_template.md) ;;
              */*) code=true ;;
              *.md) ;;
              *) code=true ;;
            esac
          done < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  rules:
    name: Rules — index and citations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - name: Check
        run: task rules:check

  backend:
    name: Backend — build & test
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    # Floor to respect if this ever moves to a container: SQLitePCLRaw 3.x needs GLIBC >= 2.33.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-backend

      - name: Format and code style check
        run: task back:format:check

      - name: Test
        run: >
          task back:test --
          -c Release --collect:"XPlat Code Coverage" --results-directory ${{ github.workspace }}/coverage

      - name: Upload backend coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          retention-days: 1
          path: coverage/**/coverage.cobertura.xml

  frontend:
    name: Frontend — build & test
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-dashboard

      - name: Type-check
        run: task front:typecheck

      - name: Lint
        run: task front:lint

      - name: Format check
        run: task front:format:check

      # Fails on any file, export or dependency nothing reaches. The repo was cleaned to zero
      # before this step landed, so a finding here is always something the branch introduced.
      - name: Dead code
        run: task front:knip

      - name: Test
        run: task front:test -- --coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          retention-days: 1
          path: src/dashboard/coverage/

  playwright-version:
    name: Playwright version
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The container tag must match the installed package, so only an exact pin is accepted.
      - name: Read the pinned version
        id: read
        run: |
          set -euo pipefail
          version=$(jq -r '.devDependencies["@playwright/test"] // .dependencies["@playwright/test"] // ""' src/dashboard/package.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::@playwright/test must be pinned to an exact version, found '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  e2e:
    name: Frontend e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [playwright-version]
    # Browsers and their system libraries come with the image, so no apt step depends on the runner mirrors.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-dashboard

      # The Playwright webServer builds the production bundle first, so no separate build step.
      - name: E2E tests
        run: task front:test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          retention-days: 7
          path: src/dashboard/playwright-report/

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend, frontend]
    permissions:
      contents: read
      pull-requests: write
    outputs:
      backend: ${{ steps.read.outputs.backend }}
      frontend: ${{ steps.read.outputs.frontend }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-coverage
          path: backend-coverage

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-coverage
          path: frontend-coverage

      # Four numbers out of two files: a third-party action for that would be a dependency to
      # trust and to pin, on a job that writes to the pull request.
      - name: Read both reports
        id: read
        run: |
          set -euo pipefail
          cp "$(find backend-coverage -name 'coverage.cobertura.xml' -print -quit)" backend.xml
          cp frontend-coverage/cobertura-coverage.xml frontend.xml
          # -m1 rather than `| head -1`: head closes the pipe on the first match, and the
          # grep still writing behind it dies of SIGPIPE, which pipefail turns into a failure.
          rate() {
            grep -m1 -o "$2=\"[0-9.]*\"" "$1" | tr -dc '0-9.' |
              awk '{ printf "%.1f", $1 * 100 }'
          }
          {
            echo '### Coverage'
            echo
            echo '| | Lines | Branches |'
            echo '|---|---:|---:|'
            echo "| Backend | $(rate backend.xml line-rate)% | $(rate backend.xml branch-rate)% |"
            echo "| Frontend | $(rate frontend.xml line-rate)% | $(rate frontend.xml branch-rate)% |"
            echo
            echo 'EF Core migrations and type-only files are out of the denominator. Everything that'
            echo 'emits runtime code is in it, tested or not.'
          } > coverage.md
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"
          # Whole line-rate percentages, for the badges job.
          echo "backend=$(rate backend.xml line-rate | awk '{ printf "%.0f", $1 }')" >> "$GITHUB_OUTPUT"
          echo "frontend=$(rate frontend.xml line-rate | awk '{ printf "%.0f", $1 }')" >> "$GITHUB_OUTPUT"

      # A fork's pull request gets a read-only token, so the comment is impossible rather than
      # merely denied: skipped, so an outside contribution never opens on a red job it cannot fix.
      # The rates are in the job summary either way.
      - name: Comment on the pull request
        if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: coverage
          recreate: true
          path: coverage.md

  # Its own job, so the write token never meets the downloaded reports or the pull request comment.
  badges:
    name: Coverage badges
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [coverage]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      # The badge endpoints live on an orphan branch, force-pushed: the README needs the latest
      # number, never the history, and main stays free of commits nobody wrote.
      - name: Publish the badge endpoints
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKEND: ${{ needs.coverage.outputs.backend }}
          FRONTEND: ${{ needs.coverage.outputs.frontend }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          badge() {
            if   [ "$1" -ge 75 ]; then colour=green
            elif [ "$1" -ge 50 ]; then colour=yellow
            else                       colour=red
            fi
            printf '{"schemaVersion":1,"label":"%s coverage","message":"%s%%","color":"%s"}' \
              "$2" "$1" "$colour" > "$work/badge-coverage-$2.json"
          }
          badge "$BACKEND" backend
          badge "$FRONTEND" frontend
          git -C "$work" init -q
          git -C "$work" checkout -qb badges
          git -C "$work" add -A
          git -C "$work" -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -qm "chore(ci): coverage badges for ${GITHUB_SHA}"
          git -C "$work" push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" badges

  images:
    name: Images
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      security-events: write

  security:
    name: Security
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
      actions: read

  # The one check the ruleset of main requires: red as soon as any job fails or is cancelled.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [changes, rules, backend, frontend, playwright-version, e2e, coverage, badges, images, security]
    steps:
      - name: Verdict
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          case " $RESULTS " in
            *' failure '*|*' cancelled '*) echo "::error::A required job failed or was cancelled"; exit 1 ;;
          esac
