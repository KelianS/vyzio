name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Daily on main, so an advisory published without any code change turns the run red.
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

# A new push to a pull request cancels the run it supersedes; on main every commit keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default; a job that writes says so in its own permissions.
permissions:
  contents: read

jobs:
  rules:
    name: Rules — index and citations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - name: Check
        run: task rules:check

  backend:
    name: Backend — build & test
    # Floor to respect if this ever moves to a container: SQLitePCLRaw 3.x needs GLIBC >= 2.33.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - name: Format check
        run: task back:format:check

      - name: Test
        run: >
          task back:test --
          -c Release --collect:"XPlat Code Coverage" --results-directory ${{ github.workspace }}/coverage

      - name: Upload backend coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          retention-days: 1
          path: coverage/**/coverage.cobertura.xml

  frontend:
    name: Frontend — build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: src/dashboard/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: src/dashboard/pnpm-lock.yaml

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - name: Install
        run: pnpm --prefix src/dashboard install --frozen-lockfile

      - name: Type-check
        run: task front:typecheck

      - name: Lint
        run: task front:lint

      - name: Format check
        run: task front:format:check

      # Fails on any file, export or dependency nothing reaches. The repo was cleaned to zero
      # before this step landed, so a finding here is always something the branch introduced.
      - name: Dead code
        run: task front:knip

      - name: Test
        run: task front:test -- --coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          retention-days: 1
          path: src/dashboard/coverage/

  playwright-version:
    name: Playwright version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The container tag must match the installed package, so only an exact pin is accepted.
      - name: Read the pinned version
        id: read
        run: |
          set -euo pipefail
          version=$(jq -r '.devDependencies["@playwright/test"] // .dependencies["@playwright/test"] // ""' src/dashboard/package.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::@playwright/test must be pinned to an exact version, found '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  e2e:
    name: Frontend e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [playwright-version]
    # Browsers and their system libraries come with the image, so no apt step depends on the runner mirrors.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: src/dashboard/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: src/dashboard/pnpm-lock.yaml

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - name: Install
        run: pnpm --prefix src/dashboard install --frozen-lockfile

      # The Playwright webServer builds the production bundle first, so no separate build step.
      - name: E2E tests
        run: task front:test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          retention-days: 7
          path: src/dashboard/playwright-report/

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend, frontend]
    permissions:
      contents: read
      pull-requests: write
    outputs:
      backend: ${{ steps.read.outputs.backend }}
      frontend: ${{ steps.read.outputs.frontend }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-coverage
          path: backend-coverage

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-coverage
          path: frontend-coverage

      # Four numbers out of two files: a third-party action for that would be a dependency to
      # trust and to pin, on a job that writes to the pull request.
      - name: Read both reports
        id: read
        run: |
          set -euo pipefail
          cp "$(find backend-coverage -name 'coverage.cobertura.xml' -print -quit)" backend.xml
          cp frontend-coverage/cobertura-coverage.xml frontend.xml
          # -m1 rather than `| head -1`: head closes the pipe on the first match, and the
          # grep still writing behind it dies of SIGPIPE, which pipefail turns into a failure.
          rate() {
            grep -m1 -o "$2=\"[0-9.]*\"" "$1" | tr -dc '0-9.' |
              awk '{ printf "%.1f", $1 * 100 }'
          }
          {
            echo '### Coverage'
            echo
            echo '| | Lines | Branches |'
            echo '|---|---:|---:|'
            echo "| Backend | $(rate backend.xml line-rate)% | $(rate backend.xml branch-rate)% |"
            echo "| Frontend | $(rate frontend.xml line-rate)% | $(rate frontend.xml branch-rate)% |"
            echo
            echo 'EF Core migrations and type-only files are out of the denominator. Everything that'
            echo 'emits runtime code is in it, tested or not.'
          } > coverage.md
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"
          # Whole line-rate percentages, for the badges job.
          echo "backend=$(rate backend.xml line-rate | awk '{ printf "%.0f", $1 }')" >> "$GITHUB_OUTPUT"
          echo "frontend=$(rate frontend.xml line-rate | awk '{ printf "%.0f", $1 }')" >> "$GITHUB_OUTPUT"

      # A fork's pull request gets a read-only token, so the comment is impossible rather than
      # merely denied: skipped, so an outside contribution never opens on a red job it cannot fix.
      # The rates are in the job summary either way.
      - name: Comment on the pull request
        if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: coverage
          recreate: true
          path: coverage.md

  # Its own job, so the write token never meets the downloaded reports or the pull request comment.
  badges:
    name: Coverage badges
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [coverage]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      # The badge endpoints live on an orphan branch, force-pushed: the README needs the latest
      # number, never the history, and main stays free of commits nobody wrote.
      - name: Publish the badge endpoints
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKEND: ${{ needs.coverage.outputs.backend }}
          FRONTEND: ${{ needs.coverage.outputs.frontend }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          badge() {
            if   [ "$1" -ge 75 ]; then colour=green
            elif [ "$1" -ge 50 ]; then colour=yellow
            else                       colour=red
            fi
            printf '{"schemaVersion":1,"label":"%s coverage","message":"%s%%","color":"%s"}' \
              "$2" "$1" "$colour" > "$work/badge-coverage-$2.json"
          }
          badge "$BACKEND" backend
          badge "$FRONTEND" frontend
          git -C "$work" init -q
          git -C "$work" checkout -qb badges
          git -C "$work" add -A
          git -C "$work" -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -qm "chore(ci): coverage badges for ${GITHUB_SHA}"
          git -C "$work" push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" badges

  docker-build-check:
    name: Docker — build images (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    # A new advisory reaches every pull request at once: it warns there and fails main and its daily run.
    env:
      BLOCKING: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/vyzio/Vyzio.Api/Dockerfile
          push: false
          tags: vyzio-api:ci
          build-args: VYZIO_REVISION=${{ github.sha }}
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build dashboard image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/dashboard/Dockerfile
          push: false
          tags: vyzio-dashboard:ci
          build-args: VYZIO_REVISION=${{ github.sha }}
          load: true
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      # One database a day: a run restores the day's copy, or else the latest one, which Trivy refreshes.
      - name: Date the vulnerability database
        id: trivy-db
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore the vulnerability database
        id: trivy-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.trivy-db.outputs.date }}
          restore-keys: trivy-db-

      - name: Scan the images
        run: |
          set -uo pipefail
          failed=''
          for image in api dashboard; do
            trivy image --severity HIGH,CRITICAL --no-progress --format sarif --output "trivy-$image.sarif" "vyzio-$image:ci" \
              || { failed="$failed $image"; continue; }
            trivy image --exit-code 1 --severity HIGH,CRITICAL --no-progress --skip-db-update "vyzio-$image:ci" || failed="$failed $image"
          done
          if [ -n "$failed" ]; then
            if [ "$BLOCKING" = true ]; then echo "::error::Image scan failed:$failed"; exit 1; fi
            echo "::warning::Image scan failed:$failed (informational on a pull request)"
          fi

      # Saved even when the scan fails, which is when main needs the day's copy most.
      - name: Save the vulnerability database
        if: always() && steps.trivy-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.trivy-db.outputs.date }}

      # A fork's pull request gets a read-only token, so the uploads are skipped; the job verdict stands.
      - name: Upload the API scan to code scanning
        if: always() && !github.event.pull_request.head.repo.fork && hashFiles('trivy-api.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api

      - name: Upload the dashboard scan to code scanning
        if: always() && !github.event.pull_request.head.repo.fork && hashFiles('trivy-dashboard.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-dashboard.sarif
          category: trivy-dashboard

  security:
    name: Security
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
      actions: read

  # The one check the ruleset of main requires: red as soon as any job fails or is cancelled.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [rules, backend, frontend, playwright-version, e2e, coverage, badges, docker-build-check, security]
    steps:
      - name: Verdict
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          case " $RESULTS " in
            *' failure '*|*' cancelled '*) echo "::error::A required job failed or was cancelled"; exit 1 ;;
          esac
