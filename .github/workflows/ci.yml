name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend — build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore src/vyzio/Vyzio.Tests/Vyzio.Tests.csproj

      - name: Build
        run: dotnet build src/vyzio/Vyzio.Tests/Vyzio.Tests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test src/vyzio/Vyzio.Tests/Vyzio.Tests.csproj --no-build -c Release

  frontend:
    name: Frontend — build & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: src/dashboard/pnpm-lock.yaml

      - name: Install
        run: pnpm --prefix src/dashboard install --frozen-lockfile

      - name: Type-check
        run: pnpm --prefix src/dashboard exec tsc --noEmit

      - name: Build
        run: pnpm --prefix src/dashboard build

  docker-build-check:
    name: Docker — build images (no push)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/vyzio/Vyzio.Api/Dockerfile
          push: false
          tags: vyzio-api:ci

      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/dashboard/Dockerfile
          push: false
          tags: vyzio-dashboard:ci
