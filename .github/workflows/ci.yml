name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend — build & test
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - uses: actions/checkout@v4

      - name: Restore
        run: dotnet restore src/vyzio/Vyzio.Tests/Vyzio.Tests.csproj

      - name: Build
        run: dotnet build src/vyzio/Vyzio.Tests/Vyzio.Tests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test src/vyzio/Vyzio.Tests/Vyzio.Tests.csproj --no-build -c Release

  frontend:
    name: Frontend — build & type-check
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    container:
      image: node:24
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install
        run: pnpm --prefix src/dashboard install --frozen-lockfile

      - name: Type-check
        run: pnpm --prefix src/dashboard exec tsc --noEmit

      - name: Build
        run: pnpm --prefix src/dashboard build

  docker-build-check:
    name: Docker — build images (no push)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/vyzio/Vyzio.Api/Dockerfile
          push: false
          tags: vyzio-api:ci

      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/dashboard/Dockerfile
          push: false
          tags: vyzio-dashboard:ci
