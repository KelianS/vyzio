version: 2

# Weekly; minor and patch updates are grouped where a group is declared, a library major comes alone.
# A runtime major (Node, .NET) or a Frigate minor or major is decided in an issue, never proposed here.
updates:
  - package-ecosystem: nuget
    directory: /src/vyzio
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /src/dashboard
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      dashboard-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The types follow the Node major the dashboard is built with, not the latest one.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directories:
      - /src/vyzio/Vyzio.Api
      - /src/dashboard
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      base-images:
        update-types: [minor, patch]
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
      - dependency-name: "*dotnet/*"
        update-types: [version-update:semver-major]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      # The fake camera of docker-compose.mock.yml: development only, never shipped.
      mock-camera:
        patterns: ["*ffmpeg", "*mediamtx"]
    ignore:
      # Frigate is still 0.x, so its minor carries the breaking changes (SAD §11, functional drift).
      - dependency-name: "*frigate"
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      actions:
        update-types: [minor, patch]
