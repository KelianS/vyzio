version: 2

# Minor and patch updates grouped weekly per ecosystem; a major one gets its own pull request.
updates:
  - package-ecosystem: nuget
    directory: /src/vyzio
    schedule:
      interval: weekly
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /src/dashboard
    schedule:
      interval: weekly
    groups:
      dashboard-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /src/vyzio/Vyzio.Api
      - /src/dashboard
    schedule:
      interval: weekly
    groups:
      base-images:
        update-types: [minor, patch]

  # Frigate is pinned there (ADR-34): its bump arrives as a pull request to review, never on its own.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
