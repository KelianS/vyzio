# Development-only Frigate config.
# This file exists to boot a minimal local runtime before Vyzio generates
# and manages the effective Frigate configuration in the product flow.

mqtt:
  host: mqtt
  port: 1883

database:
  path: /media/frigate/frigate.db

detectors:
  cpu1:
    type: cpu

cameras:
  test_camera:
    # Keep the sample camera disabled by default so `docker compose up`
    # boots a clean baseline even before a real RTSP stream is configured.
    enabled: false
    ffmpeg:
      inputs:
        - path: rtsp://replace-me-with-your-stream
          roles:
            - detect
    detect:
      enabled: true
      fps: 5