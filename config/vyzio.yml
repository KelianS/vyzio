# Configuration runtime principale de Vyzio.
#
# En pratique :
# - Vyzio pilote Frigate via son API et regenere un fichier de configuration effectif.
# - La section `discovery` sert a trouver des cameras sur le reseau local.
# - La section `notifications` contient les regles d'envoi d'alertes.

frigate:
  # URL interne utilisee par Vyzio pour joindre l'API Frigate.
  api_base_url: http://frigate:5000
  # Fichier YAML genere par Vyzio puis monte dans Frigate comme configuration effective.
  config_path: ./frigate.generated.yml
  # Commande lancee par Vyzio pour appliquer une nouvelle configuration Frigate.
  apply_command: docker restart vyzio-frigate
  # Chemin de la base Frigate visible depuis le conteneur ou l'hote Vyzio.
  database_path: /media/frigate/frigate.db
  mqtt:
    # Broker MQTT utilise par Frigate pour publier ses evenements.
    host: mqtt
    port: 1883
    topic: frigate/events
    client_id: vyzio-api
  retained_labels:
    # Labels Frigate conserves par Vyzio pour l'experience produit.
    - person

database:
  connection_string: Data Source=./data/vyzio.db

discovery:
  # Si true, Vyzio essaie de deduire automatiquement les sous-reseaux locaux.
  # A activer surtout si le conteneur partage vraiment le reseau de l'hote Linux.
  auto_detect_local_cidrs: false
  # Hotes a sonder explicitement en RTSP, en plus de la decouverte ONVIF.
  probe_hosts: []
  # Sous-reseaux a sonder en fallback unicast RTSP.
  # Exemple classique pour un LAN domestique : 192.168.1.0/24.
  probe_cidrs: ["192.168.1.0/24"]
  rtsp_ports:
    # Ports RTSP testes pendant le scan reseau.
    - 554
  http_ports:
    # Ports web testes pour reperer les interfaces constructeur de cameras d'origine.
    - 80
    - 443
    - 8080
  # Timeout de connexion par hote/port pendant la decouverte reseau.
  probe_timeout_ms: 250
  # Nombre maximum de probes reseau lances en parallele.
  max_concurrent_probes: 32

notifications:
  # Seuil minimal de confiance pour declencher une notification.
  minimum_confidence: 0.75
  telegram:
    # Laisser vide pour desactiver Telegram.
    bot_token: ""
    chat_id: ""
