frigate:
  api_base_url: http://frigate:5000
  config_path: ./frigate.generated.yml
  apply_command: docker restart vyzio-frigate
  database_path: /media/frigate/frigate.db
  mqtt:
    host: mqtt
    port: 1883
    topic: frigate/events
    client_id: vyzio-api
  retained_labels:
    - person

database:
  connection_string: Data Source=./data/vyzio.db

notifications:
  minimum_confidence: 0.75
  telegram:
    bot_token: ""
    chat_id: ""
