[project]
name = "vyzio-face-worker"
version = "0.1.0"
description = "Experimental face worker option for Vyzio; not part of the default runtime"
requires-python = ">=3.12"
dependencies = [
  "grpcio>=1.71.0",
  "grpcio-tools>=1.71.0",
  "numpy>=2.2.0",
  "pillow>=11.2.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
