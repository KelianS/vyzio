server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass         http://vyzio-api:8443/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        # Disable buffering for streaming responses (clips, live feed)
        proxy_buffering    off;
        # Allow profile photo uploads (default nginx limit is 1 MB)
        client_max_body_size 20m;
    }

    # The live view's socket (ADR-72): only this path is upgraded, and only to a WebSocket.
    location ~ ^/api/cameras/[^/]+/live/ws$ {
        proxy_pass         http://vyzio-api:8443;
        # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling -- the upgrade is fixed to websocket, the rule's own mitigation
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Upgrade websocket;
        proxy_set_header   Connection upgrade;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
    }

    location = /health {
        proxy_pass       http://vyzio-api:8443/health;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
