# The live view's socket asks for an upgrade; any other request keeps a plain connection (ADR-72).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass         http://vyzio-api:8443/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        # Disable buffering for streaming responses (clips, live feed)
        proxy_buffering    off;
        # Allow profile photo uploads (default nginx limit is 1 MB)
        client_max_body_size 20m;
    }

    location = /health {
        proxy_pass       http://vyzio-api:8443/health;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
