version: '3'

vars:
  # A clone without its own .env runs the dev stack on the example settings.
  ENV_FILE:
    sh: test -f .env && echo .env || echo .env.example
  COMPOSE_DEV: docker compose --env-file {{.ENV_FILE}} -f compose.yml -f compose.dev.yml
  COMPOSE_MOCK: docker compose --env-file {{.ENV_FILE}} -f compose.yml -f compose.mock.yml
  DASHBOARD_DIR: src/dashboard
  BACKEND_DIR: src/vyzio
  BACKEND_SLN: Vyzio.slnx
  # A local test run leaves three quarters of the cores to whoever works beside it; CI keeps them all.
  TEST_WORKERS: '{{.TEST_WORKERS | default (max 1 (div numCPU 4))}}'

tasks:
  default:
    desc: Liste les tasks disponibles
    cmds:
      - task --list
    silent: true

  # --- Infra (docker, via WSL) ---

  up:
    desc: Demarre l'infra dev (API, Frigate, MQTT...) en arriere-plan
    cmds:
      - wsl {{.COMPOSE_DEV}} up -d --build

  down:
    desc: Arrete l'infra dev
    cmds:
      - wsl {{.COMPOSE_DEV}} down

  logs:frigate:
    desc: Suit les logs de l'infra dev
    cmds:
      - wsl {{.COMPOSE_DEV}} logs frigate -f

  logs:vyzio:
    desc: Suit les logs de l'infra dev
    cmds:
      - wsl {{.COMPOSE_DEV}} logs vyzio-api -f

  mock:up:
    desc: Demarre le flux RTSP synthetique (camera mock) en plus de l'infra dev
    cmds:
      - wsl {{.COMPOSE_MOCK}} up -d

  mock:down:
    desc: Arrete le flux RTSP synthetique
    cmds:
      - wsl {{.COMPOSE_MOCK}} down

  # --- Frontend (pnpm) ---

  front:dev:
    desc: Lance le serveur de dev du dashboard (Vite)
    dir: '{{.DASHBOARD_DIR}}'
    cmds:
      - pnpm dev

  front:test:
    desc: Lance les tests frontend (vitest)
    dir: '{{.DASHBOARD_DIR}}'
    cmds:
      - pnpm test {{if not .CI}}--maxWorkers={{.TEST_WORKERS}}{{end}} {{.CLI_ARGS}}

  front:test:e2e:
    desc: Lance les tests e2e frontend (Playwright, build de prod)
    dir: '{{.DASHBOARD_DIR}}'
    cmds:
      - pnpm test:e2e {{if not .CI}}--workers={{.TEST_WORKERS}}{{end}}

  docs:capture:
    desc: Regenerates the documentation screenshots from the test fixtures
    dir: '{{.DASHBOARD_DIR}}'
    cmds:
      - pnpm capture:docs

  pr:capture:
    desc: Shoots the pull request screenshots written in src/dashboard/tools/pr-capture
    dir: '{{.DASHBOARD_DIR}}'
    cmds:
      - pnpm capture:pr

  pr:screenshots:
    desc: Publishes the pull request screenshots and prints the Markdown to paste
    dir: '{{.DASHBOARD_DIR}}'
    cmds:
      - pnpm publish:pr {{.CLI_ARGS}}

  front:lint:
    desc: Lint le frontend (eslint)
    dir: '{{.DASHBOARD_DIR}}'
    cmds:
      - pnpm lint

  front:knip:
    desc: Detecte le code mort du frontend (fichiers, exports et dependances inutilises)
    dir: '{{.DASHBOARD_DIR}}'
    cmds:
      - pnpm knip

  front:build:
    desc: Build le frontend (tsc + vite build)
    dir: '{{.DASHBOARD_DIR}}'
    cmds:
      - pnpm build

  front:format:
    desc: Formate le frontend (prettier --write)
    dir: '{{.DASHBOARD_DIR}}'
    cmds:
      - pnpm format

  front:format:check:
    desc: Verifie le formatage du frontend sans le modifier (prettier --check)
    dir: '{{.DASHBOARD_DIR}}'
    cmds:
      - pnpm format:check

  front:typecheck:
    desc: Type-checks the frontend without emitting (tsc --noEmit)
    dir: '{{.DASHBOARD_DIR}}'
    cmds:
      - pnpm exec tsc --noEmit

  # --- Backend (.NET) ---

  back:test:
    desc: Lance les tests backend (dotnet test sur Vyzio.slnx)
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - dotnet test {{.BACKEND_SLN}} {{.CLI_ARGS}} {{if not .CI}}-- xUnit.MaxParallelThreads={{.TEST_WORKERS}}{{end}}

  back:build:
    desc: Build le backend (dotnet build sur Vyzio.slnx)
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - dotnet build {{.BACKEND_SLN}}

  back:format:
    desc: Formats the backend to .editorconfig, whitespace, code style and analyzers (dotnet format)
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - dotnet format {{.BACKEND_SLN}}

  back:format:check:
    desc: Checks the backend formatting, code style and analyzers without changing anything
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - dotnet format {{.BACKEND_SLN}} --verify-no-changes

  back:migration:add:
    desc: Adds an EF Core migration with the dotnet-ef pinned in src/vyzio/.config/dotnet-tools.json (task back:migration:add -- Name)
    dir: '{{.BACKEND_DIR}}'
    preconditions:
      - sh: test -n "{{.CLI_ARGS}}"
        msg: 'Name the migration: task back:migration:add -- AddCameraNotes'
    cmds:
      - dotnet tool restore
      - dotnet tool run dotnet-ef migrations add {{.CLI_ARGS}} --project Vyzio.Infrastructure --startup-project Vyzio.Api --output-dir Persistence/Migrations

  back:run:
    desc: Lance l'API backend en local (hors docker)
    dir: '{{.BACKEND_DIR}}/Vyzio.Api'
    cmds:
      - dotnet run

  # --- Rules ---

  rules:check:
    desc: Checks docs/rules, the SPECS, its use cases and the ADRs (IDs, level lines, routing, paths, numbering, citations)
    cmds:
      - node tools/rules/check.mjs

  # --- Agrege backend + frontend ---

  test:
    desc: Lance tous les tests (backend + frontend)
    cmds:
      - task: back:test
      - task: front:test

  build:
    desc: Build backend + frontend
    cmds:
      - task: back:build
      - task: front:build

  lint:
    desc: Lints the frontend (ESLint) and checks the backend formatting and code style
    cmds:
      - task: front:lint
      - task: back:format:check

  # Steps of the rules, backend and frontend jobs of ci.yml, in their order; the image build stays CI-only.
  check:
    desc: Runs the rules, backend and frontend CI checks locally, e2e included
    cmds:
      - task: rules:check
      - task: back:format:check
      - task: back:test
      - task: front:typecheck
      - task: front:lint
      - task: front:format:check
      - task: front:knip
      # With coverage, as CI runs it, so the floor holds locally too.
      - task: front:test
        vars: { CLI_ARGS: '--coverage' }
      # The e2e webServer builds the production bundle, so no front:build before it.
      - task: front:test:e2e
