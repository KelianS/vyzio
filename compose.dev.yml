# Development override: builds images locally instead of pulling from GHCR.
# Usage: task up, or docker compose -f compose.yml -f compose.dev.yml up -d with a .env

services:
  vyzio-dashboard:
    profiles:
      - donotstart
    # <= comment the build section to use pnpm dev server instead of the built dashboard image =>
    # build:
    #   context: .
    #   dockerfile: src/dashboard/Dockerfile

  vyzio-api:
    # A local tag, so the build never shadows the release image .env names.
    image: vyzio-api:dev
    build:
      context: .
      dockerfile: src/vyzio/Vyzio.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "8443:8443"

  frigate:
    ports:
      - "127.0.0.1:5000:5000"

  mqtt:
    ports:
      - "127.0.0.1:1883:1883"
